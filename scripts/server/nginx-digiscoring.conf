# Nginx untuk gelanggang -- menggantikan `php artisan serve`.
#
# `php artisan serve` memakai server bawaan PHP, yang di Windows melayani SATU
# permintaan pada satu waktu. Akibatnya baru terasa saat gelanggang ramai: juri
# menekan beruntun, panel dan halaman overlay masing-masing menarik keadaan
# terbaru, dan antreannya tumbuh lebih cepat daripada terurai. Berkas ini
# meletakkan Nginx di depan sekumpulan proses php-cgi supaya permintaan yang
# datang berbarengan dikerjakan berbarengan.
#
# Dijalankan lewat scripts/server/jalankan-server.ps1, yang menyalakan kolam
# php-cgi-nya lebih dulu -- Nginx tidak bisa menyalakan proses PHP sendiri di
# Windows (tidak ada PHP-FPM di platform ini).
#
# Konfigurasi ini berdiri sendiri: `nginx -c` menggantikan conf bawaan
# seluruhnya, jadi blok events dan http harus lengkap di sini.

worker_processes  auto;

events {
    worker_connections  1024;
}

http {
    # PLACEHOLDER_NGINX_CONF diisi jalankan-server.ps1 dengan folder conf milik
    # Nginx. Jalur absolut, bukan `include mime.types`: berkas yang di-include
    # dicari relatif terhadap folder KONFIGURASI INI, yang berada di dalam repo,
    # bukan relatif terhadap prefix Nginx.
    include       PLACEHOLDER_NGINX_CONF/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    # Layar panel dan overlay menarik JSON terus-menerus; kompresinya jauh
    # lebih murah daripada bit yang dikirim lewat WiFi venue.
    gzip              on;
    gzip_types        application/json application/javascript text/css;
    gzip_min_length   1024;

    # Nama gelanggang, nama atlet, dan kontingen memakai huruf beraksen.
    charset  utf-8;

    access_log  logs/digiscoring-access.log;
    error_log   logs/digiscoring-error.log;

    # Satu proses php-cgi melayani satu permintaan pada satu waktu -- di
    # Windows ia tidak bisa fork. Jumlah anggota kolam inilah batas permintaan
    # yang benar-benar dikerjakan berbarengan.
    #
    # Delapan dipilih dari yang terbuka bersamaan di gelanggang: panel
    # operator, wasit, dewan juri, tiga panel juri, dan halaman-halaman
    # overlay vMix. Daftarnya harus sama persis dengan port yang dinyalakan
    # jalankan-server.ps1.
    upstream php_gelanggang {
        server 127.0.0.1:9001;
        server 127.0.0.1:9002;
        server 127.0.0.1:9003;
        server 127.0.0.1:9004;
        server 127.0.0.1:9005;
        server 127.0.0.1:9006;
        server 127.0.0.1:9007;
        server 127.0.0.1:9008;
    }

    server {
        # Port yang sama dengan `php artisan serve` selama ini, supaya aturan
        # firewall dan seluruh alamat yang sudah ditempel di vMix, HP juri, dan
        # dokumentasi tidak perlu diubah. Port 80 sengaja dihindari: Apache,
        # Laragon, atau IIS di mesin yang sama lazim sudah memegangnya.
        listen       8000;
        server_name  _;

        # Diisi jalankan-server.ps1 -- lihat baris root di sana.
        root         PLACEHOLDER_ROOT;
        index        index.php;

        # Sepadan dengan post_max_size di php.ini. Kalau yang ini lebih kecil,
        # foto akta dari kamera HP ditolak Nginx sebelum PHP sempat memberi
        # pesan galat yang bisa dibaca bendahara.
        client_max_body_size  16M;

        # Aset hasil `npm run build` dilayani Nginx langsung, tidak menyentuh
        # PHP sama sekali. Di `php artisan serve` tiap berkas JS dan CSS ikut
        # mengantre di belakang permintaan juri.
        location /build/ {
            expires    1y;
            add_header Cache-Control "public, immutable";
            try_files  $uri =404;
        }

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location ~ \.php$ {
            fastcgi_pass    php_gelanggang;
            fastcgi_index   index.php;
            include         PLACEHOLDER_NGINX_CONF/fastcgi_params;
            fastcgi_param   SCRIPT_FILENAME  $document_root$fastcgi_script_name;

            # Ekspor PDF berita acara dan bagan menyusun dokumennya di dalam
            # permintaan; 60 detik memberi ruang untuk kelas yang paling besar.
            fastcgi_read_timeout  60;
        }

        # .env, .git, dan sejenisnya tidak pernah dilayani, sekalipun ada di
        # bawah root karena salah salin.
        location ~ /\. {
            deny all;
        }
    }
}
