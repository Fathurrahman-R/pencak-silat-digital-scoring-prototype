<x-dc>

    .border-\[\#6a6a70\]{border-color:#6a6a70}

    .items-baseline{align-items:baseline}
    .items-center{align-items:center}
    .items-start{align-items:flex-start}
    .justify-between{justify-content:space-between}
    .justify-center{justify-content:center}
    .leading-\[1\.45\]{line-height:1.45}
    .min-h-0{min-height:0}
    .overflow-hidden{overflow:hidden}
    .p-\[10px\]{padding:10px}

    .text-\[14px\]{font-size:14px}
    .text-\[15px\]{font-size:15px}
    .text-\[16px\]{font-size:16px}
    .text-\[17px\]{font-size:17px}
    .text-\[18px\]{font-size:18px}

    .w-\[7px\]{width:7px}

<div class="w-[844px] h-[390px] box-border bg-[#0b0b0c] text-[#ffffff] flex flex-col p-[10px] gap-[8px] overflow-hidden">

  <div class="shrink-0 flex items-center justify-between gap-[12px] h-[24px]">

    </div>
    <span class="inline-flex items-center gap-[5px]" style="padding: 0">
      <span class="w-[7px] h-[7px] rounded-full bg-[#4ade80]"></span>
      <span class="text-[11px] font-semibold">Tersambung</span>
    </span>
  </div>

  <div class="flex-1 flex flex-col gap-[10px] min-h-0">

    <div class="shrink-0 flex items-baseline gap-[10px]">
      <span class="text-[11px] tracking-[0.1em] uppercase text-[#8a8a90]">Minta verifikasi juri</span>
      <span class="text-[12px] text-[#8a8a90]">Pasal 13 · juri memberi jawaban atas verifikasi dari Wasit</span>

    <!-- Langkah 1: apa yang ditanyakan -->

          <span class="text-[12px] text-[#8a8a90]">Sudut mana yang menjatuhkan?</span>
        </button>
        <button class="flex-1 h-[64px] bg-transparent border border-[#6a6a70] rounded-[6px] text-[#ffffff] font-sans flex flex-col items-start justify-center gap-[2px] py-0 px-[16px]">
          <span class="text-[17px] font-bold">Pelanggaran</span>
          <span class="text-[12px] text-[#8a8a90]">Sudut mana yang melanggar?</span>
        </button>
      </div>
    </div>

    <!-- Langkah 2: kejadian yang mana -->
    <div class="flex-1 flex flex-col gap-[7px] min-h-0">
      <div class="text-[11px] tracking-[0.1em] uppercase text-[#8a8a90] shrink-0">2 · Kejadian yang mana <span class="text-[#ffffff]">(boleh dilewati)</span></div>
      <div class="flex-1 flex gap-[8px] min-h-0">
        <button class="flex-1 border border-[#6a6a70] rounded-[6px] text-[#ffffff] font-sans flex flex-col items-start justify-center gap-[3px] py-0 px-[16px]" style="background: rgba(255,255,255,0.06)">
          <span class="font-mono text-[13px] text-[#8a8a90]">10:47:58</span>
          <span class="text-[15px] font-semibold">Kejadian barusan</span>
        </button>
        <button class="flex-1 bg-transparent border border-[#6a6a70] rounded-[6px] text-[#ffffff] font-sans flex flex-col items-start justify-center gap-[3px] py-0 px-[16px]">
          <span class="font-mono text-[13px] text-[#8a8a90]">10:47:31</span>
          <span class="text-[15px] font-semibold">Sebelumnya</span>

  <!-- Aksi -->
  <div class="shrink-0 flex gap-[10px] items-center">
    <button class="flex-[2] h-[64px] bg-[#e8e8ea] text-[#111114] border-0 rounded-[6px] font-sans text-[18px] font-bold flex items-center justify-center gap-[10px]">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 6v6l4 2"/><circle cx="12" cy="12" r="9"/></svg>

    <button class="flex-1 h-[64px] bg-transparent text-[#ffffff] border border-[#6a6a70] rounded-[6px] font-sans text-[16px] font-semibold">Batal</button>
    <div class="flex-[1.6] text-[12px] leading-[1.45] text-[#8a8a90]">Panel juri akan berhenti menerima nilai sampai ketiganya menjawab.</div>
