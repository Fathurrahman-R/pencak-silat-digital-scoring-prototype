        </div>

        <button class="shrink-0 h-[64px] bg-[#e8e8ea] text-[#111114] border-0 rounded-[6px] font-sans text-[18px] font-bold">Kirim nilai</button>

        <button class="bg-[#131316] border border-[#2a2a2c] rounded-[6px] text-[#ffffff] font-mono text-[22px] font-semibold">4</button>
